name: 发布 F HamLog（Nuitka → Inno Setup → Releases）

# 触发方式：仅在 Actions 页面手动点击 "Run workflow"
# 只需填写 version（同时作为 tag，例如 2.4.0），其余保留默认即可完成全流程：
#   1. Nuitka 打包（保留 pip / 虚拟环境 / Nuitka 构建目录缓存，加速下次打包）
#   2. Inno Setup 6 生成安装包（版本号自动注入，文件名形如 "F HamLog 2.4 setup.exe"）
#   3. 把安装包回写到运行分支的约定目录并提交（安装包 → F HamLog 2 Inno Setup/）
#      ⚠️ 可用输入 commit_artifacts=false 跳过这一步（只发 Release，不动 git）
#   4. 发布到 Releases（tag = 填入的版本号；附件 = 安装包 + 远程日志服务端）
#      注：自 2.8.0 起不再生成「兼容版」zip（解压即用包），仓库体积与构建时长都省一半。
#      默认发布为**草稿**，确认无误后在 Releases 页面手动点击发布
#      说明内容留空，由作者在 Releases 页面手动填写
#
# 另见 preview.yml：每次提交自动打包为「预览版」并只上传 Artifact，不写分支、不发 Release。
#
# ⚠️ 一定要在默认分支（main）上点「Run workflow」：
#    非默认分支的 .github/workflows/ 只要与 main 有差异，创建 Release 就会 403
#    （GITHUB_TOKEN 拿不到 workflows 权限），详见「预检 Release 权限」步骤的注释。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（同时用作 Release 的 tag，如 2.4.0 → 安装包 F HamLog 2.4 setup.exe）'
        required: true
      python_version:
        description: '构建所用 Python 版本'
        required: false
        default: '3.13'
      app_exe_name:
        description: '主程序 exe 名称（不含 .exe）'
        required: false
        default: 'F HamLog 2'
      remote_server_exe:
        description: '随版本发布的远程日志服务端（相对仓库根目录）'
        required: false
        default: 'F_HamLog_Remote_Log_Server_2.0.0/dist/F_HamLog_Remote_Log_Server_2.0.0.exe'
      draft:
        description: '是否发布为草稿（true / false）'
        required: false
        default: 'true'
      commit_artifacts:
        description: '是否把安装包提交回运行分支（false = 只发 Release，不动 git）'
        required: false
        default: 'true'
      upload_debug_artifact:
        description: '是否额外上传 main.dist 构建产物（调试用，会明显变慢）'
        required: false
        default: 'false'

# 同一分支只保留最新一次发布流程，避免同时写 Releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# GitHub 的 Windows runner 控制台代码页是 cp1252：Python 子进程（pip / nuitka）
# 只要往 stdio 写中文（需求文件路径、需求文件里的注释行、含中文的产物名），
# rich 就会走 legacy_windows_render → UnicodeEncodeError，pip 随之以非 0 退出
# （表现为「安装依赖失败」，真正的错误信息被这个编码异常盖掉，极难定位）。
# 这里全局强制 UTF-8；PIP_PROGRESS_BAR=off 顺带避开 rich 的进度条渲染。
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  PIP_PROGRESS_BAR: 'off'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  release:
    name: 打包并发布
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      # ------------------------------------------------------------------
      # 0. 解析版本号，推导全部产物名称
      # ------------------------------------------------------------------
      - name: 解析版本号与产物名称
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_APP_EXE: ${{ inputs.app_exe_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $version = ([string]$Env:IN_VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+(\.\d+)*$') {
            throw "版本号格式不合法：「$version」，应形如 2.4.0"
          }

          # 2.4.0 → 2.4 ；补丁版本 2.4.1 保持原样，避免同名覆盖
          $display = $version -replace '\.0$', ''

          $appExe = ([string]$Env:IN_APP_EXE).Trim()
          if ([string]::IsNullOrWhiteSpace($appExe)) { $appExe = 'F HamLog 2' }

          # 注意：紧跟中文的变量必须写成 ${display}，否则 PowerShell 会把「变量名+中文」当一个变量名
          $map = [ordered]@{
            VERSION       = $version
            DISPLAY       = $display
            APP_EXE_NAME  = $appExe
            SETUP_BASE    = "F HamLog $display setup"
            ASSET_SETUP   = "F.HamLog.$display.setup.exe"
            RELEASE_TITLE = "F HamLog $display($version)"
            # 回写运行分支用的相对路径（与历次手工提交的位置保持一致）
            COMMIT_SETUP  = "F HamLog 2 Inno Setup/F HamLog $display setup.exe"
          }
          # 显式按“无 BOM 的 UTF-8”写 GITHUB_ENV，避免不同 shell 下 Out-File 带 BOM 导致环境变量被污染
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          foreach ($k in $map.Keys) {
            [System.IO.File]::AppendAllLines($env:GITHUB_ENV, [string[]]@("$k=$($map[$k])"), $utf8NoBom)
            Write-Host "$k = $($map[$k])"
          }

          Write-Host "主程序 exe：$appExe.exe"
          Write-Host "版本号 $version → 安装包 $($map.SETUP_BASE).exe"

      # ------------------------------------------------------------------
      # 0b. 预检：Release 权限（workflow 文件是否与默认分支一致）
      # ------------------------------------------------------------------
      # GitHub 的「Create a release」接口有一条隐藏规则（REST docs / releases 一节）：
      #   若 target_commitish（本流程传的是 GITHUB_SHA）**相对默认分支**新增或修改了
      #   .github/workflows/ 下的任何文件，创建 Release / tag 的 token 必须具备
      #   「workflows: write」权限；否则接口返回 404，部分调用路径返回
      #   403 Resource not accessible by integration。
      #   而 **GITHUB_TOKEN 永远拿不到 workflows 权限**（GitHub 明确禁止），
      #   在 permissions: 里写 workflow: write 也没用。
      # 于是「在 develop 上发布、且 develop 的 .github/workflows/ 与 main 不一致」
      # 必然 403 —— 与 permissions: contents: write 无关：产物回写分支那一步能成功，
      # 是因为 push 只需要 contents 权限，跟 workflow 权限是两回事（2.8.0 已实际踩到，
      # 现象极具误导性：除了最后一步，前面全部成功）。
      # 放在打包之前，让它在几秒内失败，而不是干等一小时打包完再报 403。
      - name: 预检 Release 权限
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo    = $env:GITHUB_REPOSITORY
          $default = (gh api "repos/$repo" --jq .default_branch).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($default)) {
            throw '无法读取仓库的默认分支'
          }

          # 按「文件名=blob sha」比较两棵 workflows 目录树，等价于 GitHub 侧的判据
          $cur = @(gh api "repos/$repo/contents/.github/workflows?ref=$env:GITHUB_SHA" --jq '.[] | .name + "=" + .sha' 2>$null | Sort-Object)
          if ($LASTEXITCODE -ne 0) { $cur = @() }
          $def = @(gh api "repos/$repo/contents/.github/workflows?ref=$default" --jq '.[] | .name + "=" + .sha' 2>$null | Sort-Object)
          if ($LASTEXITCODE -ne 0) { $def = @() }

          $diff = @(Compare-Object -ReferenceObject $cur -DifferenceObject $def)
          if ($diff.Count -gt 0) {
            Write-Host "当前提交（$env:GITHUB_SHA）与默认分支（$default）的 .github/workflows/ 存在差异："
            foreach ($d in $diff) {
              # ⚠️ Compare-Object 的 SideIndicator 极易写反（2.8.0 首次上线就标反过，
              #    把「只有 main 有」显示成「仅当前提交有」，结论完全颠倒）：
              #      '<=' → 只存在于 ReferenceObject（第 1 个参数 = $cur = 当前提交）
              #      '=>' → 只存在于 DifferenceObject（第 2 个参数 = $def = 默认分支）
              $which = if ($d.SideIndicator -eq '<=') { '仅当前提交有' } else { "仅 $default 有" }
              Write-Host ("  [{0}] {1}" -f $which, $d.InputObject)
            }
            $msg = @(
              "无法创建 Release：当前分支的 .github/workflows/ 与默认分支（$default）不一致。",
              '原因：GitHub 要求创建 Release 的 token 具备 workflows 写权限，而 GITHUB_TOKEN 永远拿不到（与 permissions: 无关）。',
              '解决办法（任选其一）：',
              "  1) 先把当前分支的 workflow 改动合并进 $default，然后在 $default 上重新 Run workflow（必须是新触发的 run，不能用 Re-run）；",
              '  2) 换用带 workflow 权限的 PAT / GitHub App token，把本工作流的 GH_TOKEN 换成它；',
              "  3) 临时把当前分支的 .github/workflows/ 恢复成与 $default 完全一致后再发布（不推荐）。"
            )
            throw ($msg -join "`n")
          }
          Write-Host "预检通过：.github/workflows/ 与默认分支（$default）一致"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      # ------------------------------------------------------------------
      # 1. 依赖与缓存
      # ------------------------------------------------------------------
      - name: 缓存 pip 下载
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('第三方模块.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Nuitka 会下载 depends.exe 等辅助工具，缓存下来下次免下载
      - name: 缓存 Nuitka 辅助工具
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: ${{ runner.os }}-nuitka-tools

      # 直接复用上一次装好的虚拟环境，可省掉数分钟依赖安装时间
      - name: 缓存虚拟环境（依赖）
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ inputs.python_version }}-${{ hashFiles('第三方模块.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ inputs.python_version }}-

      - name: 准备虚拟环境与依赖
        run: |
          $ErrorActionPreference = 'Stop'
          $venv   = Join-Path $env:GITHUB_WORKSPACE '.venv'
          $venvPy = Join-Path $venv 'Scripts\python.exe'

          # 就算 workflow 级 env 没生效（比如单独跑这一段），也在进程内兜一层：
          # 让本步骤里所有 Python 子进程按 UTF-8 读写 stdio，PowerShell 也按 UTF-8 解码。
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PIP_PROGRESS_BAR = 'off'
          $env:PIP_DISABLE_PIP_VERSION_CHECK = '1'
          try { [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding $false } catch { }

          # 缓存命中时校验「版本」而不只是「能 import」：
          # actions/cache 的 restore-keys 是前缀匹配，key 变了仍会还原到旧 venv，
          # 只验 import 会让旧版本的环境被静默复用（曾因此 CI 用 PySide6 6.11.2、
          # 本地 6.11.1，两边行为不一致）。这里逐条比对 第三方模块.txt 里的 ==版本。
          $pins = @{}
          foreach ($line in Get-Content '第三方模块.txt') {
            if ($line -match '^\s*([A-Za-z0-9_.\-]+)\s*==\s*(\S+)\s*$') { $pins[$matches[1]] = $matches[2] }
          }
          if ($pins.Count -eq 0) { throw '第三方模块.txt 里没有解析到任何 ==锁定版本' }

          $ready = $false
          if (Test-Path $venvPy) {
            $installed = @{}
            & $venvPy -m pip list --format=freeze 2>$null | ForEach-Object {
              $p = $_ -split '=='
              if ($p.Count -eq 2) { $installed[$p[0].Trim()] = $p[1].Trim() }
            }
            $bad = @()
            foreach ($name in $pins.Keys) {
              if ($installed[$name] -ne $pins[$name]) {
                $bad += ('{0} 需 {1} 实际 {2}' -f $name, $pins[$name], $installed[$name])
              }
            }
            if ($bad.Count -eq 0) {
              $ready = $true
              Write-Host '缓存命中：依赖版本与 第三方模块.txt 完全一致'
            } else {
              Write-Host ('缓存版本不符，将重建：' + ($bad -join '；'))
            }
          }

          if (-not $ready) {
            Write-Host '缓存未命中或已失效：重建虚拟环境并安装依赖'
            if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
            python -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw '创建虚拟环境失败' }
            & $venvPy -m pip install --upgrade pip --progress-bar off
            # 依赖版本只认仓库根目录的 第三方模块.txt（带 == 锁定版本），
            # 别再在这里写包名列表：写死列表会和缓存键 hashFiles('第三方模块.txt') 脱钩，
            # 出现「缓存按 A 算、实际装的是 B」的漂移（曾导致 CI 装到 PySide6 6.11.2、
            # 本地是 6.11.1，两边行为不一致却查不出来源）。
            # ⚠️ 安装时用**ASCII 名字的副本**：pip 会把需求文件路径回显到输出里，
            #    文件名带中文就会触发上面说的 cp1252 编码异常（已实际踩到）。
            #    缓存键仍按仓库里的原名 hashFiles，不要改。
            $reqSrc = Join-Path $env:GITHUB_WORKSPACE '第三方模块.txt'
            $req    = Join-Path $env:RUNNER_TEMP 'requirements-ci.txt'
            Copy-Item $reqSrc $req -Force
            & $venvPy -m pip install --progress-bar off --no-input -r $req
            if ($LASTEXITCODE -ne 0) { throw '安装依赖失败' }
            & $venvPy -m pip install --progress-bar off --no-input -e .
            if ($LASTEXITCODE -ne 0) { throw '以可编辑模式安装 f-hamlog 失败' }
          }

          # 装完立刻按 第三方模块.txt 逐条核对版本：不合就在这里说清楚，
          # 别等到 Nuitka 打出一个依赖错位的包（那种包现象千奇百怪，排查成本极高）。
          $now = @{}
          & $venvPy -m pip list --format=freeze 2>$null | ForEach-Object {
            $p = $_ -split '=='
            if ($p.Count -eq 2) { $now[$p[0].Trim()] = $p[1].Trim() }
          }
          $mismatch = @()
          foreach ($name in $pins.Keys) {
            if ($now[$name] -ne $pins[$name]) {
              $mismatch += ('{0} 需 {1} 实际 {2}' -f $name, $pins[$name], $now[$name])
            }
          }
          if ($mismatch.Count -gt 0) { throw ('依赖安装后版本仍不符：' + ($mismatch -join '；')) }
          Write-Host '依赖版本校验通过（与 第三方模块.txt 完全一致）'

          [System.IO.File]::AppendAllLines($env:GITHUB_ENV, [string[]]@("PYTHON_VENV=$venvPy"), (New-Object System.Text.UTF8Encoding $false))
          # 版本号用 importlib.metadata 读取（Nuitka 4.x 已移除 nuitka.__version__）
          & $venvPy -c "import sys, importlib.metadata as md; print('Python', sys.version.split()[0]); [print(n, md.version(n)) for n in ('nuitka','PySide6','skyfield','numpy')]"

      # ------------------------------------------------------------------
      # 2. Nuitka 独立打包
      # ------------------------------------------------------------------
      # 缓存 main.build：源码未变动的模块会跳过 C 编译与链接，显著加速下一次打包
      # 目录名由打包命令里的 --output-folder-name=main 固定：不写它是 __main__.build，
      # 与这里的 main.build 对不上 → 缓存永远空转、每次全量重编（实测约 40 分钟）。
      # 键里必须带上 exe 名：Nuitka 把 result_exe 写进 SCons 命令行（main.build/scons-debug.py），
      # 命令行一变 SCons 会判定 1244 个目标全部失效 → 全量重编（约 1.3 GB 中间产物重来）。
      # preview.yml 用的是「F HamLog 2 Preview」，与本工作流的「F HamLog 2」不同，
      # 因此 restore-keys 只回退到「同 exe 名」为止，绝不跨名回退 —— 否则会捞到对方那份
      # 记录了另一个 result_exe 的构建目录，白白全量重编。
      - name: 缓存 Nuitka 构建目录
        uses: actions/cache@v4
        with:
          path: main.build
          key: ${{ runner.os }}-nuitka-build-${{ inputs.python_version }}-${{ inputs.app_exe_name }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-build-${{ inputs.python_version }}-${{ inputs.app_exe_name }}-

      - name: Nuitka 独立打包
        run: |
          $ErrorActionPreference = 'Stop'
          # ⚠️ --output-folder-name=main 必须保留：Nuitka 默认拿「主模块文件名」给产出目录取名，
          #    --main=src/f_hamlog/__main__.py 会让产物落到 __main__.dist / __main__.build；
          #    而后续「校验打包产物」、安装包（.iss 里 SourceDistDir = RepoRoot\main.dist）
          #    以及上面的构建缓存目录，全部按 main.dist / main.build 取路径。
          #    显式钉死基名后，主模块将来再改名也不会牵动这些下游路径。
          # ⚠️ 别再往这里加 --include-module：remote_crypto 由 project.py 的
          #    「from f_hamlog import remote_crypto」自动跟随收录（已实测在 Included 列表里）。
          #    写 --include-module=f_hamlog.remote_crypto 会直接 FATAL：这一步的模块解析发生在
          #    编译主模块之前，那时 __main__.py 里的 sys.path.insert(src) 还没生效，包名不可见。
          # ⚠️ PYTHONPATH 必须带上 <repo>\src，否则打出来的 exe 打不开：
          #    新版 setuptools 的 `pip install -e .` 生成的是「finder 形式」可编辑安装
          #    （__editable___f_hamlog_*_finder.py + 一行 .pth），**不再把 <repo>\src 写进
          #    sys.path**（旧版会写，所以以前没事）。Nuitka 静态分析解析 __main__.py 里的
          #    `from f_hamlog.main import main` 时因此找不到包，直接把 __main__.py 当孤立脚本
          #    编译 —— 既不报错也不告警，产出的 exe 一启动就是
          #    `ModuleNotFoundError: No module named 'f_hamlog'`；窗口版（console-mode=disable）
          #    下表现为「双击一闪而过 / 完全没反应，连日志都没有」。
          #    只在这一步设置，不影响其它步骤；用分号保留原有值。
          $env:PYTHONPATH = (Join-Path $env:GITHUB_WORKSPACE 'src') + ';' + $env:PYTHONPATH
          & $env:PYTHON_VENV -m nuitka --standalone `
            --assume-yes-for-downloads `
            --output-filename="$env:APP_EXE_NAME" `
            --output-folder-name=main `
            --main=src/f_hamlog/__main__.py `
            --windows-icon-from-ico=src/f_hamlog/file/F_HamLog.ico `
            --msvc=latest `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --include-package=skyfield `
            --include-package-data=skyfield `
            --include-package=numpy `
            --windows-uac-admin `
            --include-data-dir=src/f_hamlog/file=file/ `
            --noinclude-data-files="file/log/*.log" `
            --noinclude-data-files="file/*backup.fhl" `
            --noinclude-data-files="file/python-*.exe"
          if ($LASTEXITCODE -ne 0) { throw "Nuitka 打包失败（退出码 $LASTEXITCODE）" }

      - name: 校验打包产物
        run: |
          $ErrorActionPreference = 'Stop'
          # 产出目录名由 Nuitka 的 --output-folder-name=main 决定（默认会变成 __main__.dist）
          $dist = Join-Path $env:GITHUB_WORKSPACE 'main.dist'
          $exe = Join-Path $dist "$env:APP_EXE_NAME.exe"
          if (-not (Test-Path $exe)) {
            $found = @(Get-ChildItem $env:GITHUB_WORKSPACE -Directory -Filter '*.dist' -ErrorAction SilentlyContinue |
                       ForEach-Object { $_.Name })
            $hint = if ($found.Count -gt 0) { "实际存在的 .dist 目录：$($found -join ', ')" } else { '工作区里没有任何 .dist 目录（打包环节没产出）' }
            throw "未找到主程序：$exe；$hint"
          }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "主程序：$exe（$size MB）"
          Write-Host 'main.dist 文件数：' ([System.IO.Directory]::GetFiles($dist, '*', 'AllDirectories').Count)

          # ⚠️ 空包检查（必须保留）：如果构建时 f_hamlog 不在 sys.path 上，Nuitka 会把
          #    __main__.py 当孤立脚本编译 —— 不报错、不告警，但 exe 里一个 f_hamlog 模块
          #    都没有，用户双击就是「没反应、连日志都没有」。这里直接扫字节兜住这一整类
          #    「打包成功但产物是空壳」的问题，让它在 CI 里当场失败，而不是发出去才发现。
          $probe = 'f_hamlog.app_log'
          $text = [System.Text.Encoding]::GetEncoding(28591).GetString([System.IO.File]::ReadAllBytes($exe))
          if (-not $text.Contains($probe)) {
            throw "打包产物里找不到 '$probe' —— f_hamlog 包没被收录，exe 一启动就会 ModuleNotFoundError。请检查构建步骤是否把 <repo>\src 放进了 PYTHONPATH。"
          }
          Write-Host "空包检查通过：exe 内含 $probe"

      # 放在打包之后，避免为「调试用」白等十几分钟
      - name: 上传构建产物（调试用）
        if: ${{ inputs.upload_debug_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: F-HamLog-dist
          path: main.dist
          if-no-files-found: error

      # ------------------------------------------------------------------
      # 3. Inno Setup 6 生成安装包（自动注入版本号）
      # ------------------------------------------------------------------
      - name: 生成安装包（Inno Setup 6）
        run: |
          $ErrorActionPreference = 'Stop'

          # 运行器一般自带 Inno Setup 6，找不到就在常见目录与 Chocolatey 里找
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-ChildItem 'C:\Program Files (x86)', 'C:\Program Files' -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) {
            Write-Host '未找到 Inno Setup，尝试通过 Chocolatey 安装'
            choco install innosetup -y --no-progress
            $iscc = (Get-ChildItem 'C:\Program Files (x86)', 'C:\Program Files' -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw '未找到 ISCC.exe，无法生成安装包' }
          Write-Host "使用编译器：$iscc"

          $script = Join-Path $env:GITHUB_WORKSPACE '.github\inno\F HamLog 2.iss'
          & $iscc `
            "/DMyAppVersion=$env:VERSION" `
            "/DOutputBaseFilename=$env:SETUP_BASE" `
            "/DMyAppExeName=$env:APP_EXE_NAME.exe" `
            "/DRepoRoot=$env:GITHUB_WORKSPACE" `
            $script
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败（退出码 $LASTEXITCODE）" }

          $setup = Join-Path $env:GITHUB_WORKSPACE "release\$env:SETUP_BASE.exe"
          if (-not (Test-Path $setup)) { throw "未生成安装包：$setup" }

          # 校验版本号确实注入成功（ProductVersion 由系统补空格，必须 Trim 后比较）
          $actual = ([string](Get-Item $setup).VersionInfo.ProductVersion).Trim()
          if ($actual -ne $env:VERSION) {
            throw "安装包版本号不一致：期望 $env:VERSION，实际 $actual"
          }
          $size = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "安装包：$setup（$size MB，版本 $actual）"

      # ------------------------------------------------------------------
      # 4. 把安装包回写到运行分支（与历次手工提交的位置一致）
      # ------------------------------------------------------------------
      # 由 workflow_dispatch 的 commit_artifacts 控制：填 false 就只发 Release，
      # 不往分支里塞 130MB+ 的二进制（仓库会越滚越大，也省一次可能与开发冲突的推送）。
      # 注意 gates 用的是字符串比较：inputs 一律是字符串，别写成 inputs.commit_artifacts == true。
      - name: 提交产物到运行分支
        if: ${{ inputs.commit_artifacts == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 分支上的完整历史会一并取回：这里要先让工作区与远程一致，
          # 否则随后的 commit 会基于 checkpoint 时的旧 HEAD 造成非快进推送。
          git fetch origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "拉取分支 $env:GITHUB_REF_NAME 失败" }
          git checkout -B $env:GITHUB_REF_NAME "origin/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "切换到分支 $env:GITHUB_REF_NAME 失败" }

          $setupSrc = Join-Path $env:GITHUB_WORKSPACE "release\$env:SETUP_BASE.exe"
          $setupDst = Join-Path $env:GITHUB_WORKSPACE $env:COMMIT_SETUP

          New-Item -ItemType Directory -Path (Split-Path $setupDst -Parent) -Force | Out-Null
          Copy-Item $setupSrc $setupDst -Force

          Write-Host "安装包 → $env:COMMIT_SETUP"

          # 只暂存这个产物，避免把构建中间目录（main.dist / release / .venv）带进提交
          git add -- $env:COMMIT_SETUP
          if ($LASTEXITCODE -ne 0) { throw '暂存产物失败' }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host '产物内容与分支上的现有文件一致，无需提交'
          } else {
            git -c user.name='github-actions[bot]' `
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' `
                commit -m "打包 $env:VERSION [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw '提交产物失败' }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw '推送产物失败（分支是否有保护规则？）' }
            Write-Host "已提交并推送到 $env:GITHUB_REF_NAME"
          }

      # ------------------------------------------------------------------
      # 5. 汇总附件并发布到 Releases
      # ------------------------------------------------------------------
      - name: 准备发布附件
        env:
          IN_REMOTE_EXE: ${{ inputs.remote_server_exe }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:GITHUB_WORKSPACE 'release_assets'
          if (Test-Path $assets) { Remove-Item $assets -Recurse -Force }
          New-Item -ItemType Directory -Path $assets -Force | Out-Null

          # 安装包：历史 Release 用点号命名（F.HamLog.2.4.setup.exe），保持一致
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "release\$env:SETUP_BASE.exe") (Join-Path $assets $env:ASSET_SETUP) -Force

          # 远程日志服务端：直接取仓库中已打包好的文件，不重新打包
          $remote = ([string]$Env:IN_REMOTE_EXE).Trim() -replace '/', '\'
          if ([string]::IsNullOrWhiteSpace($remote)) {
            Write-Host '未指定远程日志服务端，跳过'
          } else {
            $remotePath = Join-Path $env:GITHUB_WORKSPACE $remote
            if (-not (Test-Path $remotePath)) { throw "找不到远程日志服务端：$remotePath" }
            Copy-Item $remotePath (Join-Path $assets (Split-Path $remote -Leaf)) -Force
            Write-Host "远程日志服务端：$remotePath"
          }

          Get-ChildItem $assets -File | ForEach-Object {
            Write-Host ("附件：{0}（{1} MB）" -f $_.Name, [math]::Round($_.Length / 1MB, 1))
          }

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_DRAFT: ${{ inputs.draft }}
          IN_COMMIT: ${{ inputs.commit_artifacts }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo   = $env:GITHUB_REPOSITORY
          $tag    = $env:VERSION
          $assets = (Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'release_assets') -File).FullName
          $isDraft = ([string]$Env:IN_DRAFT).Trim().ToLower() -eq 'true'

          # 说明内容留空（由作者在 Releases 页面手动填写）：
          # 不传 --title / --notes / --generate-notes，标题即 tag，正文为空。

          gh release view $tag -R $repo --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            # 已存在：只覆盖同名附件，不动标题与说明，避免抹掉手写内容
            Write-Host "Release $tag 已存在：覆盖同名附件（标题与说明保持不变）"
            gh release upload $tag $assets -R $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw '上传附件失败' }
          } else {
            Write-Host "创建 Release：$tag（说明留空，待手动填写）"
            $createArgs = @('release', 'create', $tag) + $assets + @(
              '-R', $repo,
              '--target', $env:GITHUB_SHA
            )
            if ($isDraft) { $createArgs += '--draft' }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败（退出码 $LASTEXITCODE）" }
          }

          $url = (gh release view $tag -R $repo --json url --jq .url)
          Write-Host "发布完成：$url"
          if ($isDraft) {
            Write-Host '当前为草稿：请到 Releases 页面确认无误后手动点击发布。'
          }
          Write-Host '请到 Releases 页面手动填写说明内容。'

          # 逐行构建，避免嵌套数组被 [string[]] 拼接成一行
          $summary = New-Object System.Collections.Generic.List[string]
          $summary.Add("## 发布完成：$env:RELEASE_TITLE")
          $summary.Add('')
          $summary.Add("- tag：``$tag``")
          $summary.Add("- Release：$url")
          $summary.Add("- 草稿：$isDraft")
          $summary.Add("- 提交：``$env:GITHUB_SHA``")
          $summary.Add('- 说明内容：留空，待手动填写')
          $summary.Add('')
          $summary.Add('### 已上传附件')
          $summary.Add('')
          foreach ($a in $assets) { $summary.Add("- ``$(Split-Path $a -Leaf)``") }
          $summary.Add('')
          if ($env:IN_COMMIT -eq 'true') {
            $summary.Add('### 已回写到运行分支')
            $summary.Add('')
            $summary.Add("- ``$env:COMMIT_SETUP``")
          } else {
            $summary.Add('### 未回写到运行分支')
            $summary.Add('')
            $summary.Add('- 已按 `commit_artifacts=false` 跳过：产物只在 Release 附件里，仓库分支未改动')
          }
          [System.IO.File]::AppendAllLines($env:GITHUB_STEP_SUMMARY, $summary.ToArray(), (New-Object System.Text.UTF8Encoding $false))
