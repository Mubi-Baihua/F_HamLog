name: 预览版 F HamLog（定时打包 → Artifact）

# 触发方式：
#   1. 定时：每天北京时间 04:00（= UTC 20:00）自动运行一次。
#   2. 手动：Actions 页面 "Run workflow" 可随时运行。
#
# 每次运行先看「上次执行到现在」这段时间里 develop 分支有没有新提交：
#   · 有新提交   → 正常打包（Nuitka + Inno + zip）
#   · 没有新提交 → 不重新打包，改为**把上一次的产物拿来当这次的产物**
#                  （下载上一次 run 的 Artifact，再作为本次 run 的 Artifact 上传）
#   两种情况都会产出 Artifact，所以每次运行结束后都能拿到「最新的一份预览产物」。
#
# 产物清理（每次运行都做）：
#   1. 删除上一份同名 Artifact（只保留最新一份）；
#   2. 删除「上一次因无提交而没有真正打包」的历史 run 记录（复用型 run 只是搬运，
#      留着会堆在 Actions 列表里）——判据见「清理上次未打包的运行记录」步骤。
#   注意顺序：复用分支必须「先下载旧的 → 再删旧 Artifact → 最后上传新的」。
on:
  schedule:
    # 北京时间 04:00 = UTC 20:00（前一天）。
    # GitHub 的 cron 用 UTC，且高负载时可能延迟几分钟到几十分钟，这是正常现象。
    - cron: '0 20 * * *'
  workflow_dispatch:

# 定时任务与手动任务串行（同一工作流只保留最新一次）
concurrency:
  group: preview
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 删除上一份 Artifact；actions: read 由 GITHUB_TOKEN 默认具备（下载旧产物）

env:
  PYTHON_VERSION: '3.13'
  # 主程序 exe 名称（不含 .exe）：与正式版区分，安装后的程序也叫这个名字
  APP_EXE_NAME: 'F HamLog 2 Preview'
  # 安装包 AppName
  APP_NAME: 'F HamLog 2 Preview'
  # 预览安装包的 AppId：必须与正式版（.github/inno/F HamLog 2.iss 里的默认值）不同，
  # 否则预览包会覆盖/卸载掉正式版
  APP_ID: '{{2AF71D4C-3B58-4E6A-9A21-6E10B7F3C4D8}'
  ARTIFACT_NAME: 'F-HamLog-Preview'

jobs:
  preview:
    name: 打包预览版
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      # ------------------------------------------------------------------
      # 0. 检出代码（含完整历史，供提交检测使用）
      # ------------------------------------------------------------------
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 1. 提交检测：上次执行到现在，develop 上有没有新提交
      # ------------------------------------------------------------------
      # 判定依据：取本工作流「上一次运行的时间」，再看 develop 上在这段时间里
      # 有没有提交。最近一条历史 run 的 createdAt 即上次执行的起点。
      # 首次运行（查不到历史）→ 视为有新提交，正常打包。
      # 同时查出「上一份产物」所在的 run id，供无新提交时复制产物使用。
      - name: 检查是否有新提交
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: preview.yml
          WATCH_BRANCH: develop
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
          # 当前这次 run 的 id：下面取「上一次运行」时必须跳过它自己
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false

          # 先取回 develop 的最新历史（checkout 默认只取触发分支）
          git fetch origin $env:WATCH_BRANCH --quiet
          if ($LASTEXITCODE -ne 0) { Write-Warning "拉取 $env:WATCH_BRANCH 失败（继续用本地已有历史）" }

          # 上一次执行的时间点（本工作流「上一次」运行，必须排除当前这次自身）
          # ⚠️ 关键修复 1：gh run list 会包含正在运行的当前 run（createdAt≈现在），
          #    若直接用最近一条当 $since，则 git rev-list --since≈现在 永远计到 0 个提交，
          #    导致「明明有提交却一直复用旧产物、从不重新打包」。
          #    因此要先跳过当前 run（SELF_RUN_ID），取它之前的那条作为上一次执行的时间点。
          # ⚠️ 关键修复 2（时区）：gh run list 的 createdAt 是 UTC 的 ISO 串（如 2026-09-28T12:00:53Z）。
          #    若直接 [string] 转成 "09/28/2026 20:00:53" 再交给 git，时区标记会丢失；
          #    git 会按 runner 的本地时区（通常 UTC）解释 → 凭空偏移 8 小时 → 漏掉窗口内的提交。
          #    因此必须显式转成 UTC 的 ISO 串（带 Z）再传给 git，保证跨时区解析一致。
          $since = ''
          try {
            $listJson = gh run list --workflow=$env:WORKFLOW_FILE --limit=10 --json databaseId,createdAt 2>$null
            if ($LASTEXITCODE -eq 0 -and $listJson) {
              $runs = @($listJson | ConvertFrom-Json)
              foreach ($r in $runs) {
                if ([string]$r.databaseId -eq [string]$env:SELF_RUN_ID) { continue }   # 跳过当前这次自身
                # 解析为 DateTime 后强制按 UTC 输出 ISO 串（带 Z），避免丢失时区导致偏移
                $dt = [datetime]::Parse([string]$r.createdAt, [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]::AdjustToUniversal -bor [System.Globalization.DateTimeStyles]::AssumeUniversal)
                $since = $dt.ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
                break
              }
            }
          } catch {
            Write-Warning "查询上一次运行失败：$_"
          }

          # 区间内 develop 上的提交数
          $count = 0
          if ([string]::IsNullOrWhiteSpace($since)) {
            $reason = '未找到历史执行记录（视为首次运行）'
          } else {
            $count = [int](git rev-list --count --since="$since" "origin/$env:WATCH_BRANCH")
            if ($LASTEXITCODE -ne 0) { $count = 0; Write-Warning '统计提交数失败，按 0 处理' }
            if ($count -gt 0) {
              $reason = "自上次执行（$since）以来 $env:WATCH_BRANCH 上有 $count 个新提交"
            } else {
              $reason = "自上次执行（$since）以来 $env:WATCH_BRANCH 上没有新提交"
            }
          }

          $should = [string]::IsNullOrWhiteSpace($since) -or ($count -gt 0)

          # 找出「上一份产物」所在的 run id：最近一条有 ARTIFACT_NAME 这个 Artifact 的 run。
          # 无新提交时用它来复制产物；找不到就退回「照常打包」，避免产出为空。
          $prevRunId = ''
          if (-not $should) {
            try {
              $artJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$env:ARTIFACT_NAME&per_page=1" 2>$null
              if ($LASTEXITCODE -eq 0 -and $artJson) {
                $arts = @(($artJson | ConvertFrom-Json).artifacts)
                if ($arts.Count -gt 0) { $prevRunId = [string]$arts[0].workflow_run.id }
              }
            } catch {
              Write-Warning "查询上一份产物失败：$_"
            }
          }

          if (-not $should -and [string]::IsNullOrWhiteSpace($prevRunId)) {
            $should = $true
            $reason = "$reason；但没有可复用的历史产物 → 改为正常打包"
            Write-Warning '未找到可复用的历史产物，本次改为正常打包。'
          }

          Write-Host $reason
          Write-Host ("是否继续打包：{0}" -f $(if ($should) { '是' } else { '否（复用上一次产物）' }))

          [System.IO.File]::AppendAllLines($env:GITHUB_ENV, [string[]]@(
            "SHOULD_BUILD=$($should.ToString().ToLower())",
            "CHECK_REASON=$reason",
            "PREV_RUN_ID=$prevRunId"
          ), $utf8NoBom)

          $summary = New-Object System.Collections.Generic.List[string]
          $summary.Add('## 提交检测')
          $summary.Add('')
          $summary.Add("- 触发方式：``$env:GITHUB_EVENT_NAME``")
          $summary.Add("- 监测分支：``$env:WATCH_BRANCH``")
          $summary.Add("- 上次执行时间：``$(if ($since) { $since } else { '（无）' })``")
          $summary.Add("- 区间内提交数：$count")
          $summary.Add("- 结论：$(if ($should) { '有新提交，正常打包' } else { "无新提交，复用上一次产物（run ``$prevRunId``）" })")
          $summary.Add("- 判定依据：$reason")
          [System.IO.File]::AppendAllLines($env:GITHUB_STEP_SUMMARY, $summary.ToArray(), $utf8NoBom)

      # ------------------------------------------------------------------
      # 2. 无新提交 → 下载上一次的产物，放到 preview_assets/ 备用
      # ------------------------------------------------------------------
      # 注意顺序：必须在「删除上一份旧 Artifact」之前下载，否则旧产物已被删。
      # 下载产物（exe + zip）到 preview_assets/，后续由统一的「上传预览产物」上传。
      # 任一步失败都不算致命：会走到下面的校验，若拿不到文件则报错中断。
      - name: 无新提交：复用上一次产物
        if: ${{ env.SHOULD_BUILD == 'false' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: preview_assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.PREV_RUN_ID }}

      - name: 无新提交：确认复用到的产物
        if: ${{ env.SHOULD_BUILD == 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'preview_assets'
          $files = @(Get-ChildItem $out -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            throw "未复用到任何产物（来源 run $env:PREV_RUN_ID），无法产出本次 Artifact。"
          }
          Write-Host "复用上一次产物（来源 run $env:PREV_RUN_ID）："
          $files | ForEach-Object {
            Write-Host ("  {0}（{1} MB）" -f $_.Name, [math]::Round($_.Length / 1MB, 1))
          }

          $summary = New-Object System.Collections.Generic.List[string]
          $summary.Add('## 复用上一次产物')
          $summary.Add('')
          $summary.Add("- 来源 run：``$env:PREV_RUN_ID``")
          $summary.Add("- 文件数：$($files.Count)")
          foreach ($f in $files) {
            $summary.Add(("- ``{0}``（{1} MB）" -f $f.Name, [math]::Round($f.Length / 1MB, 1)))
          }
          [System.IO.File]::AppendAllLines($env:GITHUB_STEP_SUMMARY, $summary.ToArray(), (New-Object System.Text.UTF8Encoding $false))

      # ------------------------------------------------------------------
      # 3. 清理「上一次未真正打包」的运行记录
      # ------------------------------------------------------------------
      # 目的：复用型 run（无提交、只是把旧产物搬过来）本身没有构建价值，留着会堆在
      # Actions 列表里；这里在每次运行时顺手把上一次这类记录删掉。
      # 为什么现在能删：它不是本次 run，已经 completed，DELETE 才会生效
      #    （运行中的 run 删不掉自己）。
      # 判据：该 run 的 job 里「Nuitka 独立打包」这一步的结论 —— 真打包过 = success；
      #    被门控跳过 = skipped。用这一点区分「打包 run」和「复用 run」。
      # 全程容错：任何失败都不中断、最多一行普通日志（不加 ::warning:: / ::error::）。
      - name: 清理上次未打包的运行记录
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: preview.yml
          SELF_RUN_ID: ${{ github.run_id }}
          BUILD_STEP_NAME: Nuitka 独立打包
        run: |
          $ErrorActionPreference = 'Continue'

          # 列最近 20 条 run，找 ①不是当前这次 ②成功完成 ③「Nuitka 独立打包」被跳过 的
          $json = gh run list --workflow=$env:WORKFLOW_FILE --limit=20 `
                    --json databaseId,conclusion,createdAt 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $json) { return }

          $runs = @()
          try { $runs = @($json | ConvertFrom-Json) } catch { return }

          foreach ($r in $runs) {
            $id = [string]$r.databaseId
            if ($id -eq [string]$env:SELF_RUN_ID) { continue }      # 不碰当前这次
            if ([string]$r.conclusion -ne 'success') { continue }    # 失败/取消的留着排查

            $concl = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$id/jobs" `
                       --jq ".jobs[].steps[] | select(.name==`"$env:BUILD_STEP_NAME`") | .conclusion" 2>$null
            if ($LASTEXITCODE -ne 0) { continue }
            $concl = ([string]$concl).Trim()
            # 只删「跳过打包」的复用型 run；真打包过（success）的保留
            if ($concl -ne 'skipped') { continue }

            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/actions/runs/$id" 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { Write-Host "已清理上一次未打包的运行记录：run $id" }
          }

      # ------------------------------------------------------------------
      # 4. 解析版本号（运行时间，UTC）
      # ------------------------------------------------------------------
      # 两种分支都要版本号（打包用；复用时也要用它给产出的 Artifact 一个可读的标识）
      - name: 解析版本号与产物名称
        run: |
          $ErrorActionPreference = 'Stop'

          # 约定：显式用 UTC，避免运行器时区（通常就是 UTC）与用户本地时间混淆
          $version = 'UTC-' + (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmm')

          # 注意：紧跟中文的变量必须写成 ${version}，否则 PowerShell 会把「变量名+中文」当一个变量名
          $map = [ordered]@{
            VERSION      = $version
            SETUP_BASE   = "F HamLog 2 Preview $version setup"
            ZIP_NAME     = "F HamLog 2 Preview ${version}兼容版.zip"
            RELEASE_TITLE = "F HamLog 2 Preview($version)"
          }
          # 显式按“无 BOM 的 UTF-8”写 GITHUB_ENV，避免不同 shell 下 Out-File 带 BOM 导致环境变量被污染
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          foreach ($k in $map.Keys) {
            [System.IO.File]::AppendAllLines($env:GITHUB_ENV, [string[]]@("$k=$($map[$k])"), $utf8NoBom)
            Write-Host "$k = $($map[$k])"
          }

          Write-Host "主程序 exe：$env:APP_EXE_NAME.exe"

      # ------------------------------------------------------------------
      # 5. Python 环境
      # ------------------------------------------------------------------
      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        if: ${{ env.SHOULD_BUILD == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ------------------------------------------------------------------
      # 6. 依赖与缓存
      # ------------------------------------------------------------------
      - name: 缓存 pip 下载
        if: ${{ env.SHOULD_BUILD == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('第三方模块.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Nuitka 会下载 depends.exe 等辅助工具，缓存下来下次免下载
      - name: 缓存 Nuitka 辅助工具
        if: ${{ env.SHOULD_BUILD == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: ${{ runner.os }}-nuitka-tools

      # 直接复用上一次装好的虚拟环境，可省掉数分钟依赖安装时间
      - name: 缓存虚拟环境（依赖）
        if: ${{ env.SHOULD_BUILD == 'true' }}
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ env.PYTHON_VERSION }}-${{ hashFiles('第三方模块.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ env.PYTHON_VERSION }}-

      - name: 准备虚拟环境与依赖
        if: ${{ env.SHOULD_BUILD == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $venv   = Join-Path $env:GITHUB_WORKSPACE '.venv'
          $venvPy = Join-Path $venv 'Scripts\python.exe'

          # 缓存命中时先校验依赖是否齐全（Python 补丁版本变化会让旧 venv 失效）
          $ready = $false
          if (Test-Path $venvPy) {
            & $venvPy -c "import PySide6, pandas, openpyxl, skyfield, numpy, cryptography, matplotlib, nuitka" 2>$null
            if ($LASTEXITCODE -eq 0) { $ready = $true; Write-Host '缓存命中：直接复用虚拟环境' }
          }

          if (-not $ready) {
            Write-Host '缓存未命中或已失效：重建虚拟环境并安装依赖'
            if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
            python -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw '创建虚拟环境失败' }
            & $venvPy -m pip install --upgrade pip
            & $venvPy -m pip install pyside6 pandas openpyxl nuitka skyfield numpy cryptography matplotlib
            if ($LASTEXITCODE -ne 0) { throw '安装依赖失败' }
            & $venvPy -m pip install -e .
            if ($LASTEXITCODE -ne 0) { throw '以可编辑模式安装 f-hamlog 失败' }
          }

          [System.IO.File]::AppendAllLines($env:GITHUB_ENV, [string[]]@("PYTHON_VENV=$venvPy"), (New-Object System.Text.UTF8Encoding $false))
          # 版本号用 importlib.metadata 读取（Nuitka 4.x 已移除 nuitka.__version__）
          & $venvPy -c "import sys, importlib.metadata as md; print('Python', sys.version.split()[0]); [print(n, md.version(n)) for n in ('nuitka','PySide6','skyfield','numpy')]"

      # ------------------------------------------------------------------
      # 7. Nuitka 独立打包
      # ------------------------------------------------------------------
      # 缓存 main.build：源码未变动的模块会跳过 C 编译与链接，显著加速下一次打包
      # 键里必须带上 exe 名：Nuitka 把 result_exe 写进 SCons 命令行（main.build/scons-debug.py），
      # 命令行一变 SCons 会判定 1244 个目标全部失效 → 全量重编（约 1.3 GB 中间产物重来）。
      # 本工作流用「F HamLog 2 Preview」，与正式版「F HamLog 2」不同，
      # 因此 restore-keys 只回退到「同 exe 名」为止，绝不跨名回退 —— 否则会捞到正式版那份
      # 记录了 result_exe=F HamLog 2.exe 的构建目录，白白全量重编。
      - name: 缓存 Nuitka 构建目录
        if: ${{ env.SHOULD_BUILD == 'true' }}
        uses: actions/cache@v4
        with:
          path: main.build
          key: ${{ runner.os }}-nuitka-build-${{ env.PYTHON_VERSION }}-${{ env.APP_EXE_NAME }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-build-${{ env.PYTHON_VERSION }}-${{ env.APP_EXE_NAME }}-

      - name: Nuitka 独立打包
        if: ${{ env.SHOULD_BUILD == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_VENV -m nuitka --standalone `
            --assume-yes-for-downloads `
            --output-filename="$env:APP_EXE_NAME" `
            --main=src/f_hamlog/__main__.py `
            --windows-icon-from-ico=src/f_hamlog/file/F_HamLog.ico `
            --msvc=latest `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --include-package=skyfield `
            --include-package-data=skyfield `
            --include-package=numpy `
            --include-module=remote_crypto `
            --windows-uac-admin `
            --include-data-dir=src/f_hamlog/file=file/
          if ($LASTEXITCODE -ne 0) { throw "Nuitka 打包失败（退出码 $LASTEXITCODE）" }

      - name: 校验打包产物
        if: ${{ env.SHOULD_BUILD == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE "main.dist\$env:APP_EXE_NAME.exe"
          if (-not (Test-Path $exe)) { throw "未找到主程序：$exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "主程序：$exe（$size MB）"
          Write-Host 'main.dist 文件数：' ([System.IO.Directory]::GetFiles("$env:GITHUB_WORKSPACE\main.dist", '*', 'AllDirectories').Count)

      # ------------------------------------------------------------------
      # 8. Inno Setup 6 生成安装包（注入预览用 AppName / AppId / 时间戳版本号）
      # ------------------------------------------------------------------
      - name: 生成安装包（Inno Setup 6）
        if: ${{ env.SHOULD_BUILD == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 运行器一般自带 Inno Setup 6，找不到就在常见目录与 Chocolatey 里找
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-ChildItem 'C:\Program Files (x86)', 'C:\Program Files' -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) {
            Write-Host '未找到 Inno Setup，尝试通过 Chocolatey 安装'
            choco install innosetup -y --no-progress
            $iscc = (Get-ChildItem 'C:\Program Files (x86)', 'C:\Program Files' -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw '未找到 ISCC.exe，无法生成安装包' }
          Write-Host "使用编译器：$iscc"

          $script = Join-Path $env:GITHUB_WORKSPACE '.github\inno\F HamLog 2.iss'
          & $iscc `
            "/DMyAppVersion=$env:VERSION" `
            "/DMyAppName=$env:APP_NAME" `
            "/DMyAppId=$env:APP_ID" `
            "/DOutputBaseFilename=$env:SETUP_BASE" `
            "/DMyAppExeName=$env:APP_EXE_NAME.exe" `
            "/DRepoRoot=$env:GITHUB_WORKSPACE" `
            $script
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败（退出码 $LASTEXITCODE）" }

          $setup = Join-Path $env:GITHUB_WORKSPACE "release\$env:SETUP_BASE.exe"
          if (-not (Test-Path $setup)) { throw "未生成安装包：$setup" }

          # 校验版本号确实注入成功（ProductVersion 由系统补空格，必须 Trim 后比较）
          $actual = ([string](Get-Item $setup).VersionInfo.ProductVersion).Trim()
          if ($actual -ne $env:VERSION) {
            throw "安装包版本号不一致：期望 $env:VERSION，实际 $actual"
          }
          $size = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "安装包：$setup（$size MB，版本 $actual）"

      # ------------------------------------------------------------------
      # 9. 兼容版压缩包（免安装）
      # ------------------------------------------------------------------
      - name: 生成兼容版压缩包
        if: ${{ env.SHOULD_BUILD == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE 'main.dist'
          $dst = Join-Path $env:GITHUB_WORKSPACE "release\$env:ZIP_NAME"
          if (Test-Path $dst) { Remove-Item $dst -Force }

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (Test-Path $sevenZip) {
            Push-Location $src
            try {
              & $sevenZip a -tzip -mx=5 $dst *
              if ($LASTEXITCODE -ne 0) { throw "7-Zip 压缩失败（退出码 $LASTEXITCODE）" }
            } finally { Pop-Location }
          } else {
            Compress-Archive -Path (Join-Path $src '*') -DestinationPath $dst -CompressionLevel Optimal
          }

          if (-not (Test-Path $dst)) { throw "未生成兼容版压缩包：$dst" }
          $size = [math]::Round((Get-Item $dst).Length / 1MB, 1)
          Write-Host "兼容版压缩包：$dst（$size MB）"

      # ------------------------------------------------------------------
      # 10. 上传 Artifact（两种分支共用；先删除上一份，避免堆积）
      # ------------------------------------------------------------------
      # 仅「正常打包」分支需要准备文件：把 release/ 里的两个产物拷进 preview_assets/。
      # 「复用」分支在上面的 download-artifact 步骤已经把文件放进 preview_assets/ 了。
      - name: 准备上传文件（打包分支）
        if: ${{ env.SHOULD_BUILD == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'preview_assets'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "release\$env:SETUP_BASE.exe") $out -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "release\$env:ZIP_NAME") $out -Force

          Get-ChildItem $out -File | ForEach-Object {
            Write-Host ("上传文件：{0}（{1} MB）" -f $_.Name, [math]::Round($_.Length / 1MB, 1))
          }

      - name: 删除上一份预览产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Artifact 有存储额度，且这里每次运行就产出一份（每份约 170 MB），
          # 因此每次上传前把上一份同名 Artifact 全部删掉，始终只保留最新一份。
          # 删除失败（例如本来就没有、或权限不足）不中断构建，只提示。
          # ⚠️ 本步骤在「复用」分支必须晚于下载：文件已下到 preview_assets/，删掉旧 Artifact 不影响。
          $ids = @()
          try {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$env:ARTIFACT_NAME&per_page=100"
            if ($LASTEXITCODE -eq 0 -and $json) {
              $ids = @(($json | ConvertFrom-Json).artifacts | ForEach-Object { $_.id })
            }
          } catch {
            Write-Warning "查询上一份 Artifact 失败：$_"
          }

          if ($ids.Count -eq 0) {
            Write-Host "没有需要删除的旧 Artifact（$env:ARTIFACT_NAME）"
          } else {
            Write-Host "删除 $($ids.Count) 份旧 Artifact：$($ids -join ', ')"
            foreach ($id in $ids) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id"
              if ($LASTEXITCODE -ne 0) { Write-Warning "删除 Artifact $id 失败（继续）" }
            }
          }

      - name: 上传预览产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: preview_assets
          if-no-files-found: error

      - name: 写入构建摘要
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'preview_assets'
          $files = @(Get-ChildItem $out -File -ErrorAction SilentlyContinue)

          $summary = New-Object System.Collections.Generic.List[string]
          if ($env:SHOULD_BUILD -eq 'true') {
            $summary.Add("## 预览版构建完成：$env:VERSION")
          } else {
            $summary.Add("## 预览版产物已刷新（复用上一次构建）")
          }
          $summary.Add('')
          $summary.Add("- 触发方式：``$env:GITHUB_EVENT_NAME``")
          $summary.Add("- 提交检测：$env:CHECK_REASON")
          if ($env:SHOULD_BUILD -eq 'false') {
            $summary.Add("- 产物来源 run：``$env:PREV_RUN_ID``（沿用其产物，未重新打包）")
          }
          $summary.Add("- 主程序 exe：``$env:APP_EXE_NAME.exe``")
          $summary.Add("- 安装包 AppName：``$env:APP_NAME``（AppId 与正式版不同，可共存）")
          $summary.Add('')
          $summary.Add('### 产物（Artifact：``' + $env:ARTIFACT_NAME + '``）')
          $summary.Add('')
          foreach ($f in $files) {
            $summary.Add(("- ``{0}``（{1} MB）" -f $f.Name, [math]::Round($f.Length / 1MB, 1)))
          }
          $summary.Add('')
          $summary.Add('> 上一份预览 Artifact 已在上传前删除，Actions 页只保留本次产物。')
          [System.IO.File]::AppendAllLines($env:GITHUB_STEP_SUMMARY, $summary.ToArray(), (New-Object System.Text.UTF8Encoding $false))
